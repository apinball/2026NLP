services:
  app:
    build: .
    container_name: nlp_pipeline
    volumes:
      - ./:/app
      - hf_cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    tty: true
    stdin_open: true
    command: python -m src.main --module all

  ollama:
    image: ollama/ollama:latest
    container_name: nlp_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  demo:
    build: .
    container_name: nlp_demo
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
      - hf_cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      PYTHONPATH: /app
    command: streamlit run src/demo/app.py --server.address 0.0.0.0 --server.port 8501

volumes:
  hf_cache:
  ollama_models: